# Because Video Studio checks.
#   checks:  every push and pull request, Linux + Windows, about a minute: tests and plugin validation.
#   evals:   every push and pull request: real Claude sessions with the plugin, graded (evals/ in the plugin).
#   install: every release tag (v*) or by hand, on a clean Mac and a clean Windows machine: the real setup, a 3 s test
#            render, a new client, a film shipped in one format and its Premiere/After Effects export. Heavier (several GB),
#            so it does not run on every push. Tick "vox" when running by hand to also install the vox tools.
name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      vox:
        description: Also install the vox tools (soundfont, FluidSynth, BiRefNet; about 3 GB more)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dictionary for the client-name test (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y wamerican
      - name: Tests
        run: node --test "tests/*.test.mjs"
      - name: Validate the plugin and the marketplace (Linux)
        if: runner.os == 'Linux'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate plugins/because-video-studio --strict
          claude plugin validate .

  # Claude's own behaviour with the plugin, graded by claude plugin eval (plugins/because-video-studio/evals/). Runs on every
  # change (push, pull request, release tag), about a minute and a few cents, with a cost ceiling. Runs only here, never on a
  # team member's computer. Signs in with the CLAUDE_CODE_OAUTH_TOKEN repo secret
  # (made by `claude setup-token`, uses the Claude plan) or, failing that, an ANTHROPIC_API_KEY secret (Console billing).
  # Each case sets its own conditions in its prompt.md (the cloud case acts out a Cloud session, hit by the team on 23-10-2026).
  evals:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Claude Code and the shell sandbox the eval runs need
        run: |
          test -n "$CLAUDE_CODE_OAUTH_TOKEN$ANTHROPIC_API_KEY" || { echo "::error::Add the CLAUDE_CODE_OAUTH_TOKEN repo secret (claude setup-token) to run the evals"; exit 1; }
          sudo apt-get install -y bubblewrap socat
          npm install -g @anthropic-ai/claude-code
      - name: Evals
        working-directory: plugins/because-video-studio
        run: >
          claude plugin eval . --tag release --trust-plugin --ablation none
          --allow-tools "Bash(node *)" "Bash(npm *)" "Bash(npx *)"
          --model claude-sonnet-5-5 --judge-model claude-haiku-5-5
          --threshold 1.0 --no-publish --max-cost-usd 5 --json eval-results.json
      - name: Keep the eval results (30 days)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evals
          path: plugins/because-video-studio/eval-results.json
          retention-days: 30

  install:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [checks, evals]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PLUGIN: plugins/because-video-studio
      VOX_FLAG: ${{ inputs.vox && '--vox' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v10.3.0
      # A person's setup installs these with Homebrew or winget; CI machines have neither ready, so they come first here
      - name: ffmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Setup, as a person would run it
        run: node "$PLUGIN/scripts/setup.mjs" --workspace "$RUNNER_TEMP/Because Studio" --music --connectors none $VOX_FLAG
      - name: A client, a film shipped, an editor package
        run: |
          cd "$RUNNER_TEMP/Because Studio"
          node tools/new-client.mjs ci-brand "CI Brand"
          node tools/new-video.mjs ci-brand smoke
          node tools/check.mjs clients/ci-brand/videos/smoke/index.html
          node tools/ship.mjs clients/ci-brand/videos/smoke/index.html --fmt 9x16
          node tools/export.mjs clients/ci-brand/videos/smoke/index.html --fmt 9x16
      - name: Music and voice, made on this computer (no keys)
        run: |
          cd "$RUNNER_TEMP/Because Studio"
          PY=.venv/bin/python; [ -f .venv/Scripts/python.exe ] && PY=.venv/Scripts/python.exe
          V=clients/ci-brand/videos/smoke
          "$PY" tools/music.py $V --dur 8 --turns 3.5
          mkdir -p $V/docs $V/vo-cache
          echo '{"voice":"ci","end":6,"lines":[{"t":0.3,"text":"One line for the test."},{"t":3,"text":"And a second line."}]}' > $V/docs/script.json
          ffmpeg -v error -f lavfi -i "sine=f=220:d=1.4" -ar 44100 $V/vo-cache/line-01.mp3
          ffmpeg -v error -f lavfi -i "sine=f=330:d=1.2" -ar 44100 $V/vo-cache/line-02.mp3
          "$PY" tools/voice.py $V
          "$PY" tools/mix.py $V --dur 8
          test -s $V/music.wav && test -s $V/vo.json && test -s $V/mix.wav
      - name: Keep the outputs for a look (7 days)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-${{ runner.os }}
          path: |
            ${{ runner.temp }}/Because Studio/.setup-test/*.mp4
            ${{ runner.temp }}/Because Studio/clients/ci-brand/videos/smoke/out/*.mp4
            ${{ runner.temp }}/Because Studio/clients/ci-brand/videos/smoke/docs/check.md
          retention-days: 7
