formats:   # canvas sizes the engine renders; safe zones are a P0 gap (source to verify)
  - {id: reel-9x16, size: [1080, 1920], use: "Instagram Reels, YouTube Shorts, master for social"}
  - {id: feed-1x1, size: [1080, 1080], use: "Instagram / Facebook feed"}
  - {id: wide-16x9, size: [1920, 1080], use: "YouTube, OTT / TV (TV-readable type)"}
  - {id: led-wall-custom, size: [custom, custom], use: "Event LED screens: any size the venue gives (e.g. 1216x760 food-area wall, 2280x1216 stage wall, 24 fps, from a production festive film). Add the size to window.film formats; check legibility at the wall's viewing distance"}
  - {id: reels-safe-zone, size: [1080, 1920], use: "Meta's own page (read 12-10-2026, https://www.facebook.com/business/help/980593475366490/): for 9:16 ads in Stories, Reels and Feed keep the top, bottom and side edges free of key elements, text and logos; check with the Safe Zone guardrail in Ads Manager; taller phones may zoom and crop outside the zone. With disclaimers on a Reels ad (RERA lines, range or offer conditions), keep the bottom 40% free of text and logos. The page gives no other percentages: the studio's 14% top / 35% bottom / 6% sides (from a production property film) is unconfirmed studio practice, not Meta's number"}

pieces:    # scenes harvested from finished films; status follows the film's production status in its client's campaigns.md
  - id: floor-build
    status: approved
    file: pieces/floor-build.js
    production: "30 s property launch film, 16:9 OTT cut, delivered (Aman, 12-10-2026)"
    kind: scene
    event: "A building assembles floor by floor on its real render, then the camera pushes into its crown"
    use_when: [property reveal, construction, growth]
    tags: [real-estate, reveal, build]
  - id: address-transitions
    status: approved
    file: pieces/list-transitions.js
    production: "30 s property launch film, 16:9 OTT cut, delivered (Aman, 12-10-2026)"
    kind: transition
    event: "Four places in 10 s, each entering with its own mask transition and a gauge showing which one it is"
    use_when: [amenities, zones, floors, locations, a list of 3-5 places]
    tags: [transition, list, real-estate]
  - id: counter-proof
    status: approved
    file: pieces/counter-proof.js
    production: "30 s property launch film, 16:9 OTT cut, delivered (Aman, 12-10-2026)"
    kind: scene
    event: "The camera tilts up a facade while a counter runs from 0 to the proof number and lands on a downbeat"
    use_when: [height, count, area, any one number that proves the claim]
    tags: [number, proof, counter]
  - id: qr-endcard
    status: approved
    file: pieces/qr-endcard.js
    production: "30 s property launch film, 16:9 OTT cut, delivered (Aman, 12-10-2026)"
    kind: endcard
    event: "Two wordmarks, a CTA pill, a phone number and a QR build in 1.5 s, then hold; a compliance line sits at the bottom"
    use_when: [any ad that ends in an enquiry: real estate, events, admissions]
    tags: [endcard, qr, cta, compliance]
  - id: type-rise-wipe
    status: approved
    file: pieces/type.js
    production: "30 s property launch film, 16:9 OTT cut, delivered (Aman, 12-10-2026)"
    kind: type
    event: "A headline rises letter by letter with a stagger, or wipes in behind a rule line"
    use_when: [premium headlines, hooks]
    tags: [type, headline]
  - id: circle-match-cut
    status: approved
    kind: scene
    event: "Round objects flash past in hard match cuts inside one locked circle, accelerating; the last circle is the product"
    use_when: [a shot list that calls for match cuts on circular shapes]
    tags: [match-cut, montage, festive, product]
    file: pieces/circle-match-cut.js
    production: "20 s festive reel, 9:16, delivered (Aman, 12-10-2026)"
  - id: powered-by-card
    status: approved
    kind: endcard
    event: "An event partner's mark springs in on the partner's own palette, POWERED BY lands, then the brand's logo rises in"
    use_when: [sponsorships, event partnerships, co-branded end cards]
    tags: [endcard, co-brand, partner]
    file: pieces/powered-by.js
    production: "20 s festive reel, 9:16, delivered (Aman, 12-10-2026)"
  - id: collage-kit
    status: approved
    kind: kit
    event: "Paper-desk language: grid paper, tape, stickers, chat bubbles, marker highlight, dashed arrow, ring burst, slam-in, impact shake, word rise, handwriting"
    use_when: [a playful or crafted brand world, highlights and callouts]
    tags: [collage, stickers, handwriting, accents]
    file: pieces/collage.js
    production: '103 s agency brand film, 16:9; accepted, "everyone liked" (Aman, 12-10-2026)'
  - id: bubble-implode
    status: approved
    kind: scene
    event: "Opinions pile up as chat bubbles, jitter, then implode into the centre on an impact and the answer lands"
    use_when: [a "too many opinions / noise" opening, then the brand as the answer]
    tags: [chat, problem, opening, implode]
    file: pieces/agency-scenes.js
    production: '103 s agency brand film, 16:9; accepted, "everyone liked" (Aman, 12-10-2026)'
  - id: strike-replace
    status: approved
    kind: scene
    event: "A claim rises and a marker strikes it through; the replacement line lands with one keyword highlighted; reasons cycle in a slot"
    use_when: ["not this, but this", myth versus fact, a claim with reasons]
    tags: [contrast, myth-vs-fact, reasons]
    file: pieces/agency-scenes.js
    production: '103 s agency brand film, 16:9; accepted, "everyone liked" (Aman, 12-10-2026)'
  - id: step-rail
    status: approved
    kind: scene
    event: "A process in N steps: each step slide pushes the last one out while a segmented progress rail fills"
    use_when: [how it works, a method in 3-6 steps]
    tags: [process, steps, how-it-works]
    file: pieces/agency-scenes.js
    production: '103 s agency brand film, 16:9; accepted, "everyone liked" (Aman, 12-10-2026)'
  - id: work-wall
    status: approved
    kind: scene
    event: "Real work thumbnails drop into a tilted collage one by one, each with a name pill, some taped, while the camera pans"
    use_when: [portfolio, clients, case studies, testimonials wall]
    tags: [portfolio, case-studies, proof, logos]
    file: pieces/agency-scenes.js
    production: '103 s agency brand film, 16:9; accepted, "everyone liked" (Aman, 12-10-2026)'
  - id: word-roller
    status: approved
    kind: scene
    event: "A lead line holds while a list rolls past one item per beat, the current item in the accent colour"
    use_when: [services, features or audiences listed fast]
    tags: [list, services, type]
    file: pieces/agency-scenes.js
    production: '103 s agency brand film, 16:9; accepted, "everyone liked" (Aman, 12-10-2026)'
  - id: grain-vignette
    status: approved
    file: pieces/texture.js
    production: "30 s property launch film, 16:9 OTT cut, delivered (Aman, 12-10-2026)"
    kind: texture
    event: "A film grain and vignette sit over the whole frame so renders read as one premium film"
    use_when: [renders or photos from different sources in one film]
    tags: [texture, premium]

