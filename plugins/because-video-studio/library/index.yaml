# Studio library · the generic layer every client can use (Because motion studio)
# Read by /motion at Orient and Build. Paths are relative to motion-studio/library/.
# Three layers: this file (generic, any client) · kits/ (generic by industry or occasion) · clients/<slug>/library.yaml (one client only).
# Run `.venv/bin/python library/check_index.py` after any change (fails on missing paths, missing fields, client names in generic files).
#
# Status: approved (use it) · candidate (harvested, its film's production status not known yet) · rejected (keep with reason, never reuse).
# A piece's status follows its source film (Aman, 12-10-2026): film went to production -> approved; film did not -> rejected.
# A generic piece is approved only when its code lives in library/pieces/ with no client name, logo, product or colour in it.
# A candidate may still point at its source inside a client video (`source:`); it is extracted when approved.

rules:
  - A toolbox, not a guideline. The reference and the picked concept decide every shot; use a piece only when a shot needs that same move. Never bend a concept to fit a piece.
  - When a shot matches a piece, reuse it before rewriting it.
  - A piece is reusable only if its `event` says what happens in it (X becomes Y on the beat), not how it looks.
  - Generic pieces take colours, fonts and logos as parameters from the client's brand/brand.json. Nothing brand-specific is hard-coded.
  - A client piece never appears in another client's video. Moving a piece from a client to this file means stripping the brand first.

engine:
  - id: engine-starter
    status: approved
    kind: engine
    event: "A new video starts with the seek(t) page, the one timing table T, the film contract (cues, sync, smooth) and live preview"
    file: ../templates/engine/index.html
    use_when: [every new video, copied by tools/new-video.mjs]
    tags: [engine, seek, contract]
  - id: springs
    status: approved
    kind: engine
    event: "Any move settles with mass: snappy for UI, default for cards and camera, heavy for type and logos, playful for mascots"
    file: ../templates/engine/motion.js
    api: "spring(t, 'snappy'|'default'|'heavy'|'playful'), track(t, keys), indicator, swapAlpha, loopT, rng"
    use_when: [every move]
    tags: [motion, spring]
  - id: blocks
    status: approved
    kind: engine
    event: "Shared drawing helpers: a line of type springs in, captions word by word, a pill, a band, a bloom, a lockup, a hop with squash, a clip frame"
    file: ../templates/engine/blocks.js
    api: "rec, win, softSpring, softTrack, hop, squash, flash, cover, prop, line, pill, wordCaptions, band, bloom, lockup, clipFrame"
    use_when: [before writing any helper]
    tags: [type, captions, lockup, bloom, camera]

tools:
  - {id: pieces-core, file: pieces/core.js, event: "Shared maths, easings and cover() that every generic piece loads first", status: approved, kind: engine}
  - {id: pieces-demo, file: pieces/demo.html, event: "Every generic piece runs on a building drawn in code, in any format (test page, no client asset)", status: approved, kind: tool}
  - {id: qr, file: ../tools/qr.py, event: "Any URL becomes a window.QR grid for the QR end card", status: approved, kind: tool}
  - {id: check, file: ../tools/check.mjs, event: "Every format is audited for cut edges, sync, smoothness and frame 0 before anyone sees anything", status: approved, kind: tool}
  - {id: ship, file: ../tools/ship.mjs, event: "Every format renders, sound mixes to -14 LUFS, poster and contact sheet are written", status: approved, kind: tool}
  - {id: sfx, file: ../tools/sfx.mjs, event: "Cues become a seeded sound file: click, pop, thump, whoosh, tick, hit, rise, beep, final", status: approved, kind: tool}
  - {id: score, file: ../tools/score.py, event: "A cue plan becomes a seeded music track made in code (cine, fusion, santoor, pulse), hits on the --note grid so cuts land on the music; no samples, no licence", status: approved, kind: tool}
  - {id: mux, file: ../tools/mux.mjs, event: "Sound goes under the picture at -14 LUFS with the true peak at or under -1 dB", status: approved, kind: tool}
  - {id: beats, file: ../tools/beats.py, event: "A supplied track becomes beats.json, phase-checked on the kick", status: approved, kind: tool}
  - {id: grab-brand, file: ../tools/grab-brand.mjs, event: "A client URL becomes brand.json plus logo, hero and page captures", status: approved, kind: tool}
  - {id: extract-frames, file: ../tools/extract-frames.mjs, event: "A reference video or folder becomes contact sheets and measured cuts", status: approved, kind: tool}

recipes:   # ad structures (layer 2), one file per kind of film
  - {id: festive-wish, file: ../recipes/festive-wish.md, status: approved, kind: recipe, event: "The product becomes the festive object; one wish line; lockup"}
  - {id: product-teaser, file: ../recipes/product-teaser.md, status: approved, kind: recipe, event: "Features switch on one per beat around the real product; lockup"}
  - {id: mascot-explainer, file: ../recipes/mascot-explainer.md, status: approved, kind: recipe, event: "A mascot acts out each line of the explanation"}

looks:     # AI generation recipes: model, prompt core, cost, known failures
  - {id: xray, file: looks/xray.md, status: approved, kind: look, event: "A real product becomes a CT-scan render with the same silhouette, then assembles itself", tags: [product, premium, ev, gadget], cost_usd: 1.70}
  - {id: chrome-glow, file: looks/chrome-glow.md, status: approved, kind: look, event: "Features become chrome objects whose brand-colour light switches on per beat", tags: [premium, feature, product], cost_usd: 2.90}

